<!-- 2026 서울 지방선거 현황 대시보드 (선관위 API 연동) -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 서울 지방선거 현황</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', 'Malgun Gothic', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }
    /* ── 헤더 ──────────────────────────────── */
    header {
      background: linear-gradient(135deg, #1e3a5f 0%, #1e293b 100%);
      padding: 20px 28px;
      border-bottom: 1px solid #334155;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-title { font-size: 22px; font-weight: 700; color: #fff; }
    .header-sub   { font-size: 13px; color: #94a3b8; margin-top: 4px; }
    .live-badge {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.12); border-radius: 20px;
      padding: 6px 14px; font-size: 12px; color: #fff; font-weight: 600;
    }
    .live-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #4ade80;
      animation: blink 1.3s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── API 키 입력 패널 ─────────────────── */
    .api-panel {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px 24px;
      margin: 20px 24px;
    }
    .api-panel h3 {
      font-size: 14px; font-weight: 700; color: #94a3b8;
      margin-bottom: 12px;
    }
    .api-row {
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    .api-input {
      flex: 1; min-width: 280px;
      height: 42px; background: #0f172a;
      border: 1px solid #475569; border-radius: 8px;
      color: #fff; padding: 0 14px; font-size: 13px; outline: none;
      font-family: monospace;
    }
    .api-input:focus { border-color: #3b82f6; }
    .api-btn {
      height: 42px; padding: 0 20px;
      background: #3b82f6; color: #fff;
      border: none; border-radius: 8px;
      font-size: 13px; font-weight: 700; cursor: pointer;
      white-space: nowrap;
    }
    .api-btn:hover { background: #2563eb; }
    .api-hint {
      font-size: 12px; color: #64748b; margin-top: 10px;
      line-height: 1.6;
    }
    .api-hint a { color: #60a5fa; text-decoration: none; }
    .api-hint a:hover { text-decoration: underline; }

    /* ── 요약 바 ───────────────────────────── */
    .summary-bar {
      display: flex; flex-wrap: wrap;
      gap: 0; background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 14px 28px;
    }
    .sum-item { padding: 0 24px; text-align: center; }
    .sum-item:first-child { padding-left: 0; }
    .sum-val { font-size: 22px; font-weight: 700; color: #fff; }
    .sum-val.blue { color: #60a5fa; }
    .sum-val.red  { color: #f87171; }
    .sum-val.green{ color: #4ade80; }
    .sum-lbl { font-size: 11px; color: #64748b; margin-top: 2px; }
    .sum-div  { width: 1px; background: #334155; height: 36px; align-self: center; }

    /* ── 필터 ──────────────────────────────── */
    .filter-bar {
      padding: 14px 24px;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .filter-lbl { font-size: 12px; color: #64748b; }
    .filter-btn {
      padding: 6px 16px; border-radius: 20px;
      border: 1.5px solid #334155; background: transparent;
      color: #94a3b8; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .filter-btn.active { color: #fff; border-color: transparent; }
    .filter-btn.f-all.active    { background: #3b82f6; }
    .filter-btn.f-minjoo.active { background: #004EA2; }
    .filter-btn.f-people.active { background: #C9151E; }
    .filter-btn.f-etc.active    { background: #64748b; }

    /* ── 시장 섹션 ─────────────────────────── */
    .mayor-section {
      margin: 0 24px 20px;
    }
    .section-title {
      font-size: 13px; font-weight: 700; color: #64748b;
      margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;
    }
    .mayor-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px 28px;
      display: flex; flex-wrap: wrap; gap: 12px;
      align-items: center;
    }
    .mayor-title {
      font-size: 18px; font-weight: 700; color: #fff;
      margin-right: 8px;
    }
    .cand-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .cand-chip {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; border-radius: 10px;
      font-size: 14px; font-weight: 700;
    }
    .cand-chip .giho {
      font-size: 11px; font-weight: 700;
      width: 20px; height: 20px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.2);
    }
    .chip-minjoo { background: rgba(0, 78, 162, 0.35); color: #93c5fd; border: 1px solid #1d4ed8; }
    .chip-people { background: rgba(201, 21, 30, 0.35); color: #fca5a5; border: 1px solid #dc2626; }
    .chip-etc    { background: rgba(100,116,139,0.3);   color: #cbd5e1;  border: 1px solid #475569; }

    /* ── 구청장 그리드 ────────────────────── */
    .gu-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      padding: 0 24px 24px;
    }
    @media (max-width: 1200px) { .gu-grid { grid-template-columns: repeat(4, 1fr); } }
    @media (max-width: 900px)  { .gu-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 600px)  { .gu-grid { grid-template-columns: repeat(2, 1fr); } }

    .gu-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 14px 16px;
      transition: border-color 0.2s;
    }
    .gu-card:hover { border-color: #475569; }
    .gu-name {
      font-size: 14px; font-weight: 700; color: #fff;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #334155;
    }
    .cand-list { display: flex; flex-direction: column; gap: 6px; }
    .cand-row {
      display: flex; align-items: center; gap: 8px;
      padding: 5px 8px; border-radius: 6px;
    }
    .cand-row.minjoo { background: rgba(0,78,162,0.2); }
    .cand-row.people { background: rgba(201,21,30,0.2); }
    .cand-row.etc    { background: rgba(100,116,139,0.15); }
    .cand-giho {
      font-size: 10px; font-weight: 700;
      width: 18px; height: 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .minjoo .cand-giho { background: #1d4ed8; color: #fff; }
    .people .cand-giho { background: #dc2626; color: #fff; }
    .etc    .cand-giho { background: #475569; color: #fff; }
    .cand-name  { font-size: 13px; font-weight: 700; color: #fff; flex: 1; }
    .cand-party { font-size: 10px; color: #94a3b8; }
    .minjoo .cand-party { color: #93c5fd; }
    .people .cand-party { color: #fca5a5; }
    .no-data {
      font-size: 12px; color: #475569;
      text-align: center; padding: 12px 0;
    }

    /* ── 로딩/에러 ─────────────────────────── */
    .status-bar {
      text-align: center; padding: 60px 24px; color: #475569;
      font-size: 14px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #334155;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .err-icon { font-size: 32px; margin-bottom: 12px; }
  </style>
</head>
<body>

<!-- 헤더 -->
<header>
  <div class="header-top">
    <div>
      <div class="header-title">🗳️ 2026 서울 지방선거 현황</div>
      <div class="header-sub">서울시장 · 25개 구청장 후보자 정보 (중앙선관위)</div>
    </div>
    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
      <div class="live-badge">
        <div class="live-dot"></div>
        선관위 실시간
      </div>
      <button onclick="loadData()"
              style="padding:7px 16px; border-radius:8px; background:rgba(255,255,255,0.12);
                     color:#fff; border:none; cursor:pointer; font-size:13px; font-weight:600;">
        🔄 새로고침
      </button>
    </div>
  </div>
</header>

<!-- API 키 입력 -->
<div class="api-panel">
  <h3>🔑 공공데이터포털 API 키</h3>
  <div class="api-row">
    <input type="text" id="api-key" class="api-input"
           placeholder="공공데이터포털 API 키를 입력하세요 (디코딩된 키)"
           oninput="saveKey()">
    <button class="api-btn" onclick="loadData()">데이터 불러오기</button>
  </div>
  <div class="api-hint">
    API 키 발급:
    <a href="https://www.data.go.kr/data/15000908/openapi.do" target="_blank">
      data.go.kr → 선거후보자등록현황 서비스 → 활용신청
    </a>
    (즉시 발급 또는 1일 소요) · 발급 후 <strong>디코딩된(Decoded) 키</strong>를 입력하세요.
  </div>
</div>

<!-- 요약 바 -->
<div class="summary-bar" id="summary-bar" style="display:none;">
  <div class="sum-item">
    <div class="sum-val" id="sum-total">0</div>
    <div class="sum-lbl">총 후보자수</div>
  </div>
  <div class="sum-div"></div>
  <div class="sum-item">
    <div class="sum-val blue" id="sum-minjoo">0</div>
    <div class="sum-lbl">민주당</div>
  </div>
  <div class="sum-div"></div>
  <div class="sum-item">
    <div class="sum-val red" id="sum-people">0</div>
    <div class="sum-lbl">국민의힘</div>
  </div>
  <div class="sum-div"></div>
  <div class="sum-item">
    <div class="sum-val" id="sum-etc">0</div>
    <div class="sum-lbl">기타·무소속</div>
  </div>
  <div class="sum-div"></div>
  <div class="sum-item">
    <div class="sum-val green" id="sum-gu">0</div>
    <div class="sum-lbl">선거구수</div>
  </div>
</div>

<!-- 필터 -->
<div class="filter-bar" id="filter-bar" style="display:none;">
  <span class="filter-lbl">정당 필터</span>
  <button class="filter-btn f-all active"    onclick="setFilter('all')">전체</button>
  <button class="filter-btn f-minjoo"        onclick="setFilter('minjoo')">🔵 민주당</button>
  <button class="filter-btn f-people"        onclick="setFilter('people')">🔴 국민의힘</button>
  <button class="filter-btn f-etc"           onclick="setFilter('etc')">⚫ 기타·무소속</button>
</div>

<!-- 콘텐츠 영역 -->
<div id="content">
  <div class="status-bar">
    <div>API 키를 입력하고 <strong>데이터 불러오기</strong>를 눌러주세요.</div>
    <div style="margin-top:8px; font-size:12px;">
      data.go.kr에서 <em>선거후보자등록현황</em> API 키를 발급받을 수 있습니다.
    </div>
  </div>
</div>

<script>
  const SG_ID    = '20260604'       // 2026 지방선거 선거일
  const SD_NAME  = '서울특별시'
  const BASE_URL = 'https://apis.data.go.kr/9760000/PofelcddInfoInqireService/getPoelpcddRegistSttusInfoInqire'
  const PROXY    = 'https://corsproxy.io/?url='

  // 서울 25개 구 목록 (가나다순)
  const GU_LIST = [
    '강남구','강동구','강북구','강서구','관악구',
    '광진구','구로구','금천구','노원구','도봉구',
    '동대문구','동작구','마포구','서대문구','서초구',
    '성동구','성북구','송파구','양천구','영등포구',
    '용산구','은평구','종로구','중구','중랑구'
  ]

  const PARTY_CLASS = {
    '더불어민주당': 'minjoo',
    '민주당':       'minjoo',
    '국민의힘':     'people',
  }

  function partyClass(name) {
    if (!name) return 'etc'
    if (name.includes('민주당')) return 'minjoo'
    if (name.includes('국민의힘')) return 'people'
    return 'etc'
  }

  let allData   = []
  let curFilter = 'all'

  function saveKey() {
    const key = document.getElementById('api-key').value.trim()
    if (key) localStorage.setItem('nec_api_key', key)
  }

  function loadKey() {
    const saved = localStorage.getItem('nec_api_key')
    if (saved) document.getElementById('api-key').value = saved
  }

  // ── 데이터 로드 ─────────────────────────────────
  async function loadData() {
    const key = document.getElementById('api-key').value.trim()
    if (!key) {
      showError('API 키를 입력해주세요.<br><a href="https://www.data.go.kr/data/15000908/openapi.do" target="_blank" style="color:#60a5fa;">data.go.kr에서 발급하기 →</a>')
      return
    }

    showLoading()

    try {
      // 시도지사(서울시장) + 자치구시군의장(구청장) 동시 요청
      const [mayorData, guData] = await Promise.all([
        fetchCandidates(key, '2', SD_NAME),   // 시도지사
        fetchCandidates(key, '5', SD_NAME)    // 자치구시군의장
      ])

      // sgTypecode=5 실패 시 sgTypecode=4 재시도
      let finalGuData = guData
      if (!finalGuData || finalGuData.length === 0) {
        finalGuData = await fetchCandidates(key, '4', SD_NAME)
      }

      allData = [...(mayorData || []), ...(finalGuData || [])]

      if (allData.length === 0) {
        showError('데이터가 없습니다.<br>sgId(' + SG_ID + ') 또는 API 키를 확인해주세요.')
        return
      }

      renderAll()

    } catch (e) {
      showError('로딩 실패: ' + (e.message || '알 수 없는 오류'))
    }
  }

  async function fetchCandidates(key, sgTypecode, sdName, pageNo = 1, acc = []) {
    const params = new URLSearchParams({
      serviceKey: key,
      sgId:       SG_ID,
      sgTypecode,
      sdName,
      numOfRows:  100,
      pageNo,
      type:       'json'
    })
    const url  = `${BASE_URL}?${params}`
    const resp = await fetch(PROXY + encodeURIComponent(url))
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`)

    const text = await resp.text()
    let json
    try { json = JSON.parse(text) } catch { throw new Error('응답 파싱 실패') }

    const body  = json?.response?.body
    if (!body) throw new Error(json?.response?.header?.resultMsg || '응답 구조 오류')

    const items = body?.items?.item
    if (!items) return acc

    const rows = Array.isArray(items) ? items : [items]
    const merged = [...acc, ...rows]

    const total    = parseInt(body.totalCount || 0, 10)
    const fetched  = pageNo * 100
    if (fetched < total) {
      return fetchCandidates(key, sgTypecode, sdName, pageNo + 1, merged)
    }
    return merged
  }

  // ── 렌더링 ───────────────────────────────────────
  function renderAll() {
    const filtered = curFilter === 'all' ? allData : allData.filter(d => {
      const cls = partyClass(d.partyName || d.party)
      if (curFilter === 'minjoo') return cls === 'minjoo'
      if (curFilter === 'people') return cls === 'people'
      if (curFilter === 'etc')    return cls === 'etc'
      return true
    })

    renderSummary()
    renderMayor(filtered)
    renderGu(filtered)

    document.getElementById('summary-bar').style.display = 'flex'
    document.getElementById('filter-bar').style.display  = 'flex'
  }

  function renderSummary() {
    const minjoo = allData.filter(d => partyClass(d.partyName) === 'minjoo').length
    const people = allData.filter(d => partyClass(d.partyName) === 'people').length
    const etc    = allData.length - minjoo - people
    const gu     = new Set(allData.map(d => d.sggName || d.sigunguName)).size

    document.getElementById('sum-total').textContent  = allData.length
    document.getElementById('sum-minjoo').textContent = minjoo
    document.getElementById('sum-people').textContent = people
    document.getElementById('sum-etc').textContent    = etc
    document.getElementById('sum-gu').textContent     = gu
  }

  function renderMayor(data) {
    // sgTypecode=2 or jdName이 '서울특별시'인 항목
    const mayors = data.filter(d =>
      d.sgTypecode === '2' ||
      (d.jdName || '').includes('서울특별시') && !(d.sggName || d.sigunguName || '').includes('구')
    ).sort((a, b) => parseInt(a.giho || 0) - parseInt(b.giho || 0))

    const content = document.getElementById('content')
    let html = ''

    if (mayors.length > 0) {
      html += `
        <div class="mayor-section" id="mayor-section">
          <div class="section-title">서울특별시장</div>
          <div class="mayor-card">
            <div class="mayor-title">서울시장</div>
            <div class="cand-chips">
              ${mayors.map(c => {
                const cls  = partyClass(c.partyName)
                const name = c.name || c.후보자명 || ''
                const party= c.partyName || c.정당명 || ''
                const giho = c.giho || c.기호 || ''
                return `
                  <div class="cand-chip chip-${cls}">
                    <span class="giho">${giho}</span>
                    <span>${name}</span>
                    <span style="font-size:11px; opacity:0.7;">${party}</span>
                  </div>
                `
              }).join('')}
            </div>
          </div>
        </div>
      `
    }

    html += `
      <div style="padding: 0 24px; margin-bottom:10px;">
        <div class="section-title">구청장 (25개 구)</div>
      </div>
      <div class="gu-grid" id="gu-grid"></div>
    `

    content.innerHTML = html
    renderGu(data)
  }

  function renderGu(data) {
    const grid = document.getElementById('gu-grid')
    if (!grid) return

    // 구청장: sggName 또는 sigunguName 기준 그루핑
    const guMap = {}
    data.forEach(d => {
      const gu = (d.sggName || d.sigunguName || '').replace('서울특별시 ', '').replace('서울시 ', '')
      if (!gu || !gu.includes('구')) return
      if (!guMap[gu]) guMap[gu] = []
      guMap[gu].push(d)
    })

    // 가나다순 구 목록 (데이터에 없는 구도 표시)
    const guKeys = [...new Set([...GU_LIST, ...Object.keys(guMap)])].sort()

    grid.innerHTML = guKeys.map(gu => {
      const cands = (guMap[gu] || []).sort((a, b) => parseInt(a.giho || 0) - parseInt(b.giho || 0))

      const candRows = cands.length > 0
        ? cands.map(c => {
            const cls   = partyClass(c.partyName)
            const name  = c.name  || ''
            const party = c.partyName || ''
            const giho  = c.giho  || ''
            return `
              <div class="cand-row ${cls}">
                <span class="cand-giho">${giho}</span>
                <span class="cand-name">${name}</span>
                <span class="cand-party">${partyShort(party)}</span>
              </div>
            `
          }).join('')
        : '<div class="no-data">후보 데이터 없음</div>'

      return `
        <div class="gu-card">
          <div class="gu-name">${gu}</div>
          <div class="cand-list">${candRows}</div>
        </div>
      `
    }).join('')
  }

  function partyShort(name) {
    if (!name) return ''
    if (name.includes('더불어민주당') || name === '민주당') return '민주당'
    if (name.includes('국민의힘')) return '국민의힘'
    if (name.includes('정의당')) return '정의당'
    if (name.includes('무소속')) return '무소속'
    if (name.length > 6) return name.slice(0, 6) + '…'
    return name
  }

  function setFilter(f) {
    curFilter = f
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'))
    document.querySelector(`.f-${f}`).classList.add('active')
    renderAll()
  }

  function showLoading() {
    document.getElementById('summary-bar').style.display = 'none'
    document.getElementById('filter-bar').style.display  = 'none'
    document.getElementById('content').innerHTML = `
      <div class="status-bar">
        <div class="spinner"></div>
        선관위 데이터를 불러오는 중...
      </div>
    `
  }

  function showError(msg) {
    document.getElementById('summary-bar').style.display = 'none'
    document.getElementById('filter-bar').style.display  = 'none'
    document.getElementById('content').innerHTML = `
      <div class="status-bar">
        <div class="err-icon">⚠️</div>
        <div>${msg}</div>
      </div>
    `
  }

  // 초기화
  loadKey()
</script>
</body>
</html>
