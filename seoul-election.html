    .hdr-badges { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .badge {
      padding:5px 13px; border-radius:20px;
      font-size:12px; font-weight:700; color:#fff;
      background:rgba(255,255,255,0.12);
    }
    .badge.red  { background:rgba(239,68,68,0.3);  border:1px solid #ef4444; }
    .badge.live { display:flex; align-items:center; gap:5px; }
    .dot { width:7px; height:7px; border-radius:50%; background:#4ade80; animation:blink 1.3s infinite; }
    @keyframes blink { 0%,100%{opacity:1}50%{opacity:0.3} }

    /* ── 요약 바 ── */
    .sum-bar {
      background:#1e293b; border-bottom:1px solid #334155;
      padding:12px 28px; display:flex; align-items:center; flex-wrap:wrap; gap:0;
    }
    .si { padding:0 22px; text-align:center; }
    .si:first-child { padding-left:0; }
    .sv { font-size:22px; font-weight:700; color:#fff; }
    .sv.b { color:#60a5fa; } .sv.r { color:#f87171; }
    .sv.y { color:#fbbf24; } .sv.g { color:#4ade80; }
    .sl { font-size:11px; color:#64748b; margin-top:2px; }
    .sdiv { width:1px; background:#334155; height:34px; align-self:center; }

    /* ── 필터 ── */
    .fbar { padding:12px 24px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .flbl { font-size:12px; color:#64748b; }
    .fbtn {
      padding:5px 14px; border-radius:20px;
      border:1.5px solid #334155; background:transparent;
      color:#94a3b8; font-size:12px; font-weight:600; cursor:pointer; transition:.15s;
    }
    .fbtn:hover { border-color:#475569; color:#cbd5e1; }
    .fbtn.on { border-color:transparent; color:#fff; }
    .fbtn.fa.on { background:#475569; }
    .fbtn.fm.on { background:#1d4ed8; }
    .fbtn.fp.on { background:#dc2626; }
    .fbtn.fr.on { background:#f97316; }
    .fbtn.fe.on { background:#64748b; }

    /* ── 시장 섹션 ── */
    .sec { margin:0 24px 18px; }
    .sec-lbl { font-size:11px; font-weight:700; color:#64748b; letter-spacing:1px; text-transform:uppercase; margin-bottom:8px; }
    .mayor-card {
      background:#1e293b; border:1px solid #334155; border-radius:14px;
      padding:18px 24px; display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    }
    .mayor-ttl { font-size:16px; font-weight:700; color:#fff; margin-right:4px; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; }
    .chip {
      display:flex; align-items:center; gap:7px;
      padding:7px 14px; border-radius:9px; font-size:13px; font-weight:700;
    }
    .chip .age { font-size:10px; opacity:.65; font-weight:400; margin-left:2px; }

    /* ── 구 그리드 ── */
    .gu-grid {
      display:grid; gap:10px; padding:0 24px 28px;
      grid-template-columns: repeat(5,1fr);
    }
    @media(max-width:1100px){.gu-grid{grid-template-columns:repeat(4,1fr);}}
    @media(max-width:860px) {.gu-grid{grid-template-columns:repeat(3,1fr);}}
    @media(max-width:600px) {.gu-grid{grid-template-columns:repeat(2,1fr);}}

    .gc {
      background:#1e293b; border:1px solid #334155; border-radius:11px;
      padding:12px 14px; transition:border-color .15s;
    }
    .gc:hover { border-color:#475569; }
    .gn {
      font-size:13px; font-weight:700; color:#fff;
      padding-bottom:8px; margin-bottom:8px; border-bottom:1px solid #334155;
      display:flex; justify-content:space-between; align-items:center;
    }
    .gcount { font-size:10px; color:#64748b; font-weight:400; }
    .clist { display:flex; flex-direction:column; gap:5px; }
    .crow {
      display:flex; align-items:center; gap:7px;
      padding:5px 8px; border-radius:6px;
    }
    .cgiho {
      width:17px; height:17px; border-radius:50%;
      font-size:9px; font-weight:700;
      display:flex; align-items:center; justify-content:center;
      flex-shrink:0; color:#fff;

    .cparty { font-size:9px; }
    .cage   { font-size:9px; color:#64748b; }

    .pm .cparty { color:#93c5fd; }

    .chip-p { background:rgba(201,21,30,.35); border:1px solid #dc2626; color:#fca5a5; }

    .chip-e { background:rgba(100,116,139,.3); border:1px solid #475569; color:#cbd5e1; }

    .hidden { display:none !important; }

const GIHO_ORDER = { m:1, p:2, r:3, j:4, l:5, i:'무' }
const PARTY_SHORT = {
  '더불어민주당':'민주당', '국민의힘':'국민의힘', '개혁신당':'개혁신당',
  '진보당':'진보당', '노동당':'노동당', '무소속':'무소속'
}

let curFilter = 'all'

function buildGrid() {
  const grid = document.getElementById('gu-grid')
  grid.innerHTML = GU_DATA.map(({ gu, cands }) => {
    const rows = cands.map((c, i) => `
      <div class="crow ${PC_CLASS[c.pc]}" data-pc="${c.pc}">
        <span class="cgiho">${GIHO_ORDER[c.pc] || '무'}</span>
        <span class="cname">${c.n}</span>
        <span class="cparty">${PARTY_SHORT[c.p] || c.p}</span>
        <span class="cage">${c.age}·${c.g}</span>
      </div>`).join('')
    return `
      <div class="gc">
        <div class="gn">${gu}<span class="gcount">${cands.length}명</span></div>
        <div class="clist">${rows}</div>
      </div>`
  }).join('')
}

function setFilter(f) {
  curFilter = f
  document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('on'))
  document.querySelector(`.f${f === 'all' ? 'a' : f}`).classList.add('on')

  // 구청장 필터
  document.querySelectorAll('.gc').forEach(card => {
    if (f === 'all') { card.classList.remove('hidden'); return }
    const hasMatch = [...card.querySelectorAll('.crow')].some(r => r.dataset.pc === f)
    card.classList.toggle('hidden', !hasMatch)
  })
  document.querySelectorAll('.crow').forEach(r => {
    r.style.opacity = (f === 'all' || r.dataset.pc === f) ? '1' : '0.2'
  })

  // 시장 칩 필터
  document.querySelectorAll('.chip').forEach(c => {
    c.style.opacity = (f === 'all' || c.dataset.party === f) ? '1' : '0.2'
  })
}

function updateDday() {
  const election = new Date('2026-06-03T06:00:00+09:00')
  const now      = new Date()
  const diff     = Math.ceil((election - now) / 86400000)
  document.getElementById('dday').textContent = diff > 0 ? diff : (diff === 0 ? 'Day' : '종료')
}

buildGrid()
updateDday()
setInterval(updateDday, 60000)
