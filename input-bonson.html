<!-- 본선 전용 투표수 입력 화면 (민주당/국민의힘 동시 입력, 개표마감 상단 고정) -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>투표수 입력 (본선)</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .party-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
    }
    .badge-minjoo { background: #E3F0FF; color: #004EA2; }
    .badge-people { background: #FFE8E8; color: #C9151E; }

    .vote-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1.5px solid #e0e0e0;
    }
    .vote-row.minjoo { border-color: #93c5fd; background: #f0f7ff; }
    .vote-row.people { border-color: #fca5a5; background: #fff5f5; }
    .vote-row label  { font-size: 13px; font-weight: 700; min-width: 68px; }
    .vote-row.minjoo label { color: #004EA2; }
    .vote-row.people label { color: #C9151E; }
    .vote-row input  { flex: 1; border: none; background: transparent;
                        font-size: 18px; font-weight: 700; text-align: right;
                        outline: none; width: 0; }

    .closing-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .closing-row:last-child { border-bottom: none; }
  </style>
</head>
<body>

<div id="loading" class="loading">
  <div class="spinner"></div>
  <span>캠프 정보를 불러오는 중...</span>
</div>

<div id="error-screen" style="display:none; padding:40px 24px; text-align:center;">
  <p style="font-size:32px">⚠️</p>
  <p id="error-msg" style="margin-top:12px; color:#dc2626; font-weight:600;"></p>
  <a href="index.html" style="display:inline-block; margin-top:16px; color:#004EA2;">← 처음으로</a>
</div>

<div id="main" style="display:none;">

  <!-- 헤더 -->
  <header class="camp-header" style="background:#1e3a5f;">
    <div class="label">투표수 입력 (본선)</div>
    <h1 id="header-district" style="color:#fff;"></h1>
    <div style="margin-top:4px; display:flex; gap:6px; justify-content:center; flex-wrap:wrap;">
      <span id="badge-minjoo" class="party-badge badge-minjoo" style="display:none;">민주당</span>
      <span id="badge-people" class="party-badge badge-people" style="display:none;">국민의힘</span>
    </div>
  </header>

  <!-- 입력 폼 -->
  <div class="card">
    <div id="form-error"   class="msg-error"   style="display:none;"></div>
    <div id="form-success" class="msg-success" style="display:none;"></div>

    <div class="form-group">
      <label>본부입력담당자</label>
      <input type="text" id="inp-name" placeholder="홍길동" maxlength="20"
             list="name-datalist" autocomplete="off">
      <datalist id="name-datalist"></datalist>
    </div>

    <div class="form-group">
      <label>전화번호</label>
      <div style="display:flex; gap:8px; align-items:center;">
        <input type="tel" id="inp-phone" placeholder="010-0000-0000"
               inputmode="numeric" maxlength="13" style="flex:1;">
        <button type="button" id="phone-edit-btn" onclick="unlockPhone()"
                style="display:none; padding:0 14px; height:48px; border-radius:10px;
                       border:1.5px solid #e0e0e0; background:#fff; color:#555;
                       font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;">
          수정
        </button>
      </div>
    </div>

    <div class="form-group">
      <label>투표 동</label>
      <select id="inp-dong">
        <option value="">-- 동을 선택하세요 --</option>
      </select>
      <div id="unit-display" style="display:none; margin-top:6px; font-size:13px; color:#666; font-weight:600;"></div>
    </div>

    <div class="form-group">
      <label>투표자수</label>
      <div style="display:flex; flex-direction:column; gap:8px; margin-top:4px;">
        <div class="vote-row minjoo" id="row-minjoo" style="display:none;">
          <label>🔵 민주당</label>
          <input type="number" id="inp-votes-minjoo" placeholder="0" inputmode="numeric" max="99999">
          <span style="font-size:14px; color:#004EA2; font-weight:600;">표</span>
        </div>
        <div class="vote-row people" id="row-people" style="display:none;">
          <label>🔴 국민의힘</label>
          <input type="number" id="inp-votes-people" placeholder="0" inputmode="numeric" max="99999">
          <span style="font-size:14px; color:#C9151E; font-weight:600;">표</span>
        </div>
      </div>
    </div>

    <button class="btn btn-primary" id="btn-submit" onclick="submitVotes()"
            style="background:#1e3a5f;">
      제 출
    </button>
  </div>

  <!-- 실적 버튼 -->
  <div style="margin: 0 12px 8px;">
    <button class="btn btn-primary" onclick="openRanking()"
            style="background:#1e3a5f; width:100%;">
      📊 본부입력담당자 실적
    </button>
  </div>

  <!-- 실적 모달 -->
  <div id="ranking-modal" style="display:none; position:fixed; inset:0;
    background:rgba(0,0,0,0.55); z-index:999; overflow-y:auto; padding:20px 12px;">
    <div style="background:#fff; border-radius:16px; max-width:480px; margin:0 auto;">
      <div style="padding:16px 20px; border-bottom:1px solid #eee;
                  display:flex; justify-content:space-between; align-items:center;">
        <span style="font-weight:700; font-size:15px;">📊 본부입력담당자 실적</span>
        <button onclick="closeRanking()"
                style="border:none; background:none; font-size:20px; cursor:pointer; color:#888;">✕</button>
      </div>
      <div id="ranking-list" style="padding:8px 0;"></div>
      <div style="padding:12px 16px; border-top:1px solid #eee;">
        <button class="btn btn-secondary" onclick="closeRanking()">닫기</button>
      </div>
    </div>
  </div>

  <!-- 제출 이력 -->
  <div class="card" id="history-card" style="display:none;">
    <h3 style="font-size:14px; font-weight:700; color:#555; margin-bottom:12px;">내 제출 이력</h3>
    <ul class="history-list" id="history-list"></ul>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<script src="js/address.js"></script>
<script>
  // 캠프 { minjoo: campObj | null, people: campObj | null }
  let camps         = { minjoo: null, people: null }
  let reporterMap   = {}
  let selectedPhone = null

  // ── 초기화 ──────────────────────────────────────
  async function init() {
    const slug = getParam('slug')
    if (!slug) return showError('캠프 주소가 올바르지 않습니다.')

    // -minjoo/-people 접미사를 제거해 공통 base 추출
    const base       = slug.replace(/-(minjoo|people)$/, '')
    const minjooSlug = `${base}-minjoo`
    const peopleSlug = `${base}-people`

    try {
      const [r1, r2] = await Promise.all([
        db.from('camps').select('*').eq('slug', minjooSlug).maybeSingle(),
        db.from('camps').select('*').eq('slug', peopleSlug).maybeSingle()
      ])

      camps.minjoo = r1.data || null
      camps.people = r2.data || null

      if (!camps.minjoo && !camps.people)
        return showError('등록된 캠프를 찾을 수 없습니다.')

      renderHeader()
      renderVoteRows()
      const anyCamp = camps.minjoo || camps.people
      await loadDongOptions(anyCamp)
      await loadReporterList()
      restoreInputs()
      await loadMyHistory()

      document.getElementById('loading').style.display = 'none'
      document.getElementById('main').style.display    = 'block'

    } catch (e) {
      showError('오류가 발생했습니다: ' + e.message)
    }
  }

  // ── 헤더 렌더 ────────────────────────────────────
  function renderHeader() {
    const c = camps.minjoo || camps.people
    document.title = `${c.district} 투표수 입력 (본선)`
    document.getElementById('header-district').textContent = `${c.sido} ${c.district}`
    if (camps.minjoo) document.getElementById('badge-minjoo').style.display = 'inline-block'
    if (camps.people) document.getElementById('badge-people').style.display = 'inline-block'
  }

  // ── 투표수 입력 행 표시 ──────────────────────────
  function renderVoteRows() {
    if (camps.minjoo) document.getElementById('row-minjoo').style.display = 'flex'
    if (camps.people) document.getElementById('row-people').style.display = 'flex'
  }

  // ── 동 드롭다운 ──────────────────────────────────
  async function loadDongOptions(camp) {
    const dongs = await loadDongs(camp.sigungu)
    const sel   = document.getElementById('inp-dong')
    dongs.forEach(d => {
      const opt = document.createElement('option')
      opt.value = d; opt.textContent = d
      sel.appendChild(opt)
    })
  }

  // ── 담당자 목록 (양당 DB + localStorage 병합) ────
  async function loadReporterList() {
    const campIds = [camps.minjoo?.id, camps.people?.id].filter(Boolean)
    reporterMap = {}

    for (const id of campIds) {
      const { data } = await db
        .from('submissions')
        .select('reporter_name, reporter_phone')
        .eq('camp_id', id)
        .order('submitted_at', { ascending: false })
      ;(data || []).forEach(row => {
        if (!reporterMap[row.reporter_name]) reporterMap[row.reporter_name] = row.reporter_phone
      })
    }

    const anyCamp = camps.minjoo || camps.people
    const saved = JSON.parse(localStorage.getItem(`cv_reporters_${anyCamp.slug.replace(/-(minjoo|people)$/, '')}`) || '[]')
    saved.forEach(({ name, phone }) => { if (!reporterMap[name]) reporterMap[name] = phone })

    refreshNameDatalist()
  }

  function refreshNameDatalist() {
    const dl = document.getElementById('name-datalist')
    dl.innerHTML = ''
    Object.keys(reporterMap).forEach(name => {
      const opt = document.createElement('option'); opt.value = name; dl.appendChild(opt)
    })
  }

  function maskPhone(phone) {
    const p = phone.split('-')
    return p.length === 3 ? `${p[0]}-****-${p[2]}` : phone
  }

  function applyReporterSelection(name) {
    const phone   = reporterMap[name]
    const phoneEl = document.getElementById('inp-phone')
    const editBtn = document.getElementById('phone-edit-btn')
    if (phone) {
      selectedPhone = phone
      phoneEl.value = maskPhone(phone); phoneEl.readOnly = true
      phoneEl.style.background = '#f5f5f5'; phoneEl.style.color = '#888'
      editBtn.style.display = 'inline-block'
    } else {
      selectedPhone = null
      phoneEl.readOnly = false; phoneEl.style.background = ''; phoneEl.style.color = ''
      editBtn.style.display = 'none'
    }
  }

  function unlockPhone() {
    selectedPhone = null
    const phoneEl = document.getElementById('inp-phone')
    phoneEl.value = ''; phoneEl.readOnly = false
    phoneEl.style.background = ''; phoneEl.style.color = ''
    document.getElementById('phone-edit-btn').style.display = 'none'
    phoneEl.focus()
  }

  function saveReporter(name, phone) {
    if (!name || !phone) return
    const anyCamp = camps.minjoo || camps.people
    const key  = `cv_reporters_${anyCamp.slug.replace(/-(minjoo|people)$/, '')}`
    const list = JSON.parse(localStorage.getItem(key) || '[]')
    localStorage.setItem(key, JSON.stringify([{ name, phone }, ...list.filter(r => r.name !== name)].slice(0, 20)))
    if (!reporterMap[name]) { reporterMap[name] = phone; refreshNameDatalist() }
  }

  // ── 입력값 복원 ──────────────────────────────────
  function restoreInputs() {
    const anyCamp = camps.minjoo || camps.people
    const saved   = JSON.parse(localStorage.getItem(`cv_input_${anyCamp.slug.replace(/-(minjoo|people)$/, '')}`) || '{}')
    if (saved.name) {
      document.getElementById('inp-name').value = saved.name
      applyReporterSelection(saved.name)
      if (!selectedPhone && saved.phone) document.getElementById('inp-phone').value = saved.phone
    }
    if (saved.dong) document.getElementById('inp-dong').value = saved.dong
  }

  // ── 제출 이력 (양당 합산) ────────────────────────
  async function loadMyHistory() {
    const phone = selectedPhone || document.getElementById('inp-phone').value
    if (!phone || !isValidPhone(phone)) return

    const rows = []
    for (const [party, camp] of Object.entries(camps)) {
      if (!camp) continue
      const { data } = await db
        .from('submissions')
        .select('dong, vote_count, submitted_at')
        .eq('camp_id', camp.id)
        .eq('reporter_phone', phone)
        .order('submitted_at', { ascending: false })
        .limit(10)
      ;(data || []).forEach(r => rows.push({ ...r, party }))
    }
    if (rows.length === 0) return

    rows.sort((a, b) => b.submitted_at.localeCompare(a.submitted_at))

    const list = document.getElementById('history-list')
    list.innerHTML = ''
    rows.slice(0, 15).forEach(row => {
      const li    = document.createElement('li')
      li.className = 'history-item'
      const badge = row.party === 'minjoo'
        ? `<span class="party-badge badge-minjoo" style="font-size:10px;">민주당</span>`
        : `<span class="party-badge badge-people" style="font-size:10px;">국민의힘</span>`
      const escapedDong = row.dong.replace(/'/g, "\\'")
      const cancelBtn = row.vote_count > 0
        ? `<button onclick="cancelSubmission(this,'${row.party}','${escapedDong}',${row.vote_count})"
                   style="font-size:11px; padding:2px 8px; border-radius:4px; border:1px solid #dc2626;
                          background:#fff; color:#dc2626; cursor:pointer; white-space:nowrap; flex-shrink:0;">취소</button>`
        : `<span style="font-size:11px; color:#94a3b8; flex-shrink:0;">보정됨</span>`
      li.innerHTML = `
        <span class="history-time">${formatTime(row.submitted_at)}</span>
        <span style="display:flex; align-items:center; gap:4px;">${badge} ${row.dong}</span>
        <span style="display:flex; align-items:center; gap:6px;">
          <span class="history-votes">${formatNumber(row.vote_count)}표</span>
          ${cancelBtn}
        </span>
      `
      list.appendChild(li)
    })
    document.getElementById('history-card').style.display = 'block'
  }

  // ── 제출 ─────────────────────────────────────────
  async function submitVotes() {
    hideMsg()
    const name        = document.getElementById('inp-name').value.trim()
    const dong        = document.getElementById('inp-dong').value
    const actualPhone = selectedPhone || document.getElementById('inp-phone').value.trim()
    const minjooVal   = parseInt(document.getElementById('inp-votes-minjoo')?.value || '', 10)
    const peopleVal   = parseInt(document.getElementById('inp-votes-people')?.value || '', 10)

    if (!name || name.length < 2)   return showFormError('이름을 2자 이상 입력하세요.')
    if (!isValidPhone(actualPhone)) return showFormError('전화번호를 확인하세요. (010-XXXX-XXXX)')
    if (!dong)                       return showFormError('담당 동을 선택하세요.')

    const hasMinjoo = camps.minjoo && !isNaN(minjooVal) && minjooVal > 0
    const hasPeople = camps.people && !isNaN(peopleVal) && peopleVal > 0
    if (!hasMinjoo && !hasPeople)    return showFormError('투표자수를 1 이상 입력하세요.')

    const btn = document.getElementById('btn-submit')
    btn.disabled = true; btn.textContent = '제출 중...'

    const successes = [], errors = []
    try {
      if (hasMinjoo) {
        const blocked = await checkDuplicatePhone(camps.minjoo, name, actualPhone)
        if (!blocked) {
          const err = await doInsert(camps.minjoo, name, actualPhone, dong, minjooVal)
          if (err) errors.push(`민주당: ${err}`)
          else     successes.push(`민주당 ${formatNumber(minjooVal)}표`)
        }
      }
      if (hasPeople) {
        const blocked = await checkDuplicatePhone(camps.people, name, actualPhone)
        if (!blocked) {
          const err = await doInsert(camps.people, name, actualPhone, dong, peopleVal)
          if (err) errors.push(`국민의힘: ${err}`)
          else     successes.push(`국민의힘 ${formatNumber(peopleVal)}표`)
        }
      }

      if (successes.length > 0) {
        saveReporter(name, actualPhone)
        const anyCamp = camps.minjoo || camps.people
        localStorage.setItem(`cv_input_${anyCamp.slug.replace(/-(minjoo|people)$/, '')}`,
          JSON.stringify({ name, phone: actualPhone, dong }))
        showFormSuccess(successes.join(' / ') + ' 제출 완료!')
        if (document.getElementById('inp-votes-minjoo')) document.getElementById('inp-votes-minjoo').value = ''
        if (document.getElementById('inp-votes-people')) document.getElementById('inp-votes-people').value = ''
        await loadMyHistory()
      }
      if (errors.length > 0) showFormError(errors.join('\n'))

    } finally {
      btn.disabled = false; btn.textContent = '제 출'
    }
  }

  // ── 실제 INSERT (캠프별) ──────────────────────────
  async function doInsert(camp, name, phone, dong, votes) {
    try {
      const ip = await getClientIP()
      const { error } = await db.from('submissions').insert({
        camp_id: camp.id, reporter_name: name, reporter_phone: phone,
        dong, vote_count: votes, vote_type: '일반', ip_address: ip
      })
      return error ? error.message : null
    } catch (e) {
      return e.message
    }
  }

  // ── 전화번호 중복 체크 ───────────────────────────
  async function checkDuplicatePhone(camp, name, actualPhone) {
    if (selectedPhone) return false
    const { data } = await db
      .from('submissions').select('reporter_name')
      .eq('camp_id', camp.id).eq('reporter_phone', actualPhone).limit(1)
    if (data && data.length > 0 && data[0].reporter_name !== name) {
      showFormError(`[${camp.party_name}] 이 번호는 이미 '${data[0].reporter_name}'으로 등록되어 있습니다.`)
      return true
    }
    return false
  }

  // ── 제출 취소 ────────────────────────────────────
  async function cancelSubmission(btn, party, dong, voteCount) {
    if (!confirm(`[${party === 'minjoo' ? '민주당' : '국민의힘'} · ${dong}] ${formatNumber(voteCount)}표를 취소하시겠습니까?`)) return
    const name        = document.getElementById('inp-name').value.trim()
    const actualPhone = selectedPhone || document.getElementById('inp-phone').value.trim()
    if (!name || !isValidPhone(actualPhone)) { showFormError('이름과 전화번호를 먼저 입력하세요.'); return }
    btn.disabled = true; btn.textContent = '처리중...'
    const camp = camps[party]
    if (!camp) return
    const err = await doInsert(camp, name, actualPhone, dong, -voteCount)
    if (err) showFormError('취소 실패: ' + err)
    else { showFormSuccess('취소 처리됐습니다.'); await loadMyHistory() }
    btn.disabled = false; btn.textContent = '취소'
  }

  // ── 실적 모달 ────────────────────────────────────
  async function openRanking() {
    document.getElementById('ranking-modal').style.display = 'block'
    document.getElementById('ranking-list').innerHTML =
      '<div style="text-align:center; padding:24px; color:#888;">불러오는 중...</div>'
    const myPhone = selectedPhone || document.getElementById('inp-phone').value.trim()

    const map = {}
    for (const [party, camp] of Object.entries(camps)) {
      if (!camp) continue
      const { data } = await db
        .from('submissions')
        .select('reporter_name, reporter_phone, dong, vote_count, submitted_at')
        .eq('camp_id', camp.id).order('submitted_at', { ascending: false })
      ;(data || []).forEach(row => {
        const key = row.reporter_phone
        if (!map[key]) map[key] = { name: row.reporter_name, id: key, votes: 0, dong: row.dong, time: row.submitted_at }
        map[key].votes += row.vote_count
        if (row.submitted_at > map[key].time) { map[key].time = row.submitted_at; map[key].dong = row.dong }
      })
    }

    const sorted = Object.values(map).sort((a, b) => b.votes - a.votes)
    if (sorted.length === 0) {
      document.getElementById('ranking-list').innerHTML =
        '<div style="text-align:center; padding:24px; color:#888;">아직 제출 데이터가 없습니다.</div>'
      return
    }

    const list = document.getElementById('ranking-list')
    list.innerHTML = ''
    sorted.forEach((r, i) => {
      const isMe  = r.id === myPhone
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}.`
      const div = document.createElement('div')
      div.style.cssText = `padding:12px 20px; display:flex; align-items:center; gap:12px;
        border-bottom:1px solid #f0f0f0; background:${isMe ? '#f0f7ff' : '#fff'};`
      div.innerHTML = `
        <span style="font-size:18px; min-width:28px;">${medal}</span>
        <div style="flex:1;">
          <div style="font-weight:${isMe ? '700' : '600'}; font-size:14px;">
            ${r.name}${isMe ? ' <span style="color:#1e3a5f; font-size:11px;">(나)</span>' : ''}
          </div>
          <div style="font-size:12px; color:#888; margin-top:2px;">${r.dong} · ${formatTime(r.time)}</div>
        </div>
        <span style="font-size:17px; font-weight:700; color:${isMe ? '#1e3a5f' : '#222'};">
          ${formatNumber(r.votes)}표
        </span>
      `
      list.appendChild(div)
    })
  }

  function closeRanking() {
    document.getElementById('ranking-modal').style.display = 'none'
  }

  // ── 이벤트 바인딩 ────────────────────────────────
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('inp-name').addEventListener('change', e => {
      applyReporterSelection(e.target.value.trim())
    })

    const phoneEl = document.getElementById('inp-phone')
    phoneEl.addEventListener('input', e => { if (!phoneEl.readOnly) e.target.value = formatPhone(e.target.value) })
    phoneEl.addEventListener('blur', async () => {
      await loadMyHistory()
    })

    document.getElementById('inp-dong').addEventListener('change', async () => {
      const dong   = document.getElementById('inp-dong').value
      const unitEl = document.getElementById('unit-display')
      if (dong) {
        const anyCamp = camps.minjoo || camps.people
        const unit = await getUnitByDong(anyCamp.sigungu, dong)
        if (unit) { unitEl.textContent = `→ ${anyCamp.sigungu}${unit} 선거구`; unitEl.style.display = 'block' }
        else       { unitEl.style.display = 'none' }
      } else { unitEl.style.display = 'none' }
    })

    init()
  })

  // ── UI 헬퍼 ──────────────────────────────────────
  function showError(msg) {
    document.getElementById('loading').style.display = 'none'
    document.getElementById('error-screen').style.display = 'block'
    document.getElementById('error-msg').textContent = msg
  }
  function showFormError(msg)   { const e = document.getElementById('form-error');   e.textContent = msg; e.style.display = 'block' }
  function showFormSuccess(msg) { const e = document.getElementById('form-success'); e.textContent = msg; e.style.display = 'block' }
  function hideMsg() {
    document.getElementById('form-error').style.display   = 'none'
    document.getElementById('form-success').style.display = 'none'
  }
</script>
</body>
</html>
